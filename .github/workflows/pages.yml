name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Per-project build steps (Python export, Rust -> wasm, ...) go here later.
      - name: Assemble site
        run: |
          mkdir -p _dist
          cp -r site projects index.html _dist/
      # Every deploy gets its own ?v= (the commit hash), so browsers never mix cached old files with new ones.
      # app.js passes this version on to demos, docs, real.json and images. Fails if the stamp didn't land.
      - name: Stamp version
        run: |
          V=${GITHUB_SHA::8}
          sed -i -E "s/\?v=[0-9A-Za-z]+/?v=$V/g" _dist/site/index.html
          test "$(grep -c "?v=$V" _dist/site/index.html)" = 2
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _dist
      - id: deploy
        uses: actions/deploy-pages@v4
