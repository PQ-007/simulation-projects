<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Inter,system-ui,sans-serif">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  <!-- ghost body, centred on (0,0) -->
  <path id="ghost" d="M-16,14 V-2 A16,16 0 0 1 16,-2 V14 L11,9 L6,14 L0,9 L-6,14 L-11,9 Z"/>
  <g id="eyes"><circle cx="-6" cy="-3" r="4.5" fill="#fff"/><circle cx="6" cy="-3" r="4.5" fill="#fff"/><circle cx="-4.5" cy="-3" r="2.2" fill="#1d4ed8"/><circle cx="7.5" cy="-3" r="2.2" fill="#1d4ed8"/></g>
</defs>
<rect width="640" height="400" fill="#fff"/>

<!-- states -->
<g font-size="15" font-weight="700" text-anchor="middle">
  <rect x="40" y="40" width="170" height="96" rx="16" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <use href="#ghost" x="125" y="72" fill="#f472b6"/><use href="#eyes" x="125" y="72"/>
  <text x="125" y="116" fill="#9d174d">Scatter</text>

  <rect x="430" y="40" width="170" height="96" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <use href="#ghost" x="515" y="72" fill="#ef4444"/><use href="#eyes" x="515" y="72"/>
  <text x="515" y="116" fill="#991b1b">Chase</text>

  <rect x="235" y="250" width="170" height="96" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <use href="#ghost" x="320" y="282" fill="#2563eb"/>
  <g fill="#fde68a"><rect x="311" y="276" width="5" height="5"/><rect x="324" y="276" width="5" height="5"/></g>
  <path d="M308,292 l4,-3 l4,3 l4,-3 l4,3 l4,-3 l4,3" fill="none" stroke="#fde68a" stroke-width="1.6"/>
  <text x="320" y="326" fill="#1e3a8a">Frightened</text>

  <rect x="470" y="250" width="150" height="96" rx="16" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
  <use href="#eyes" x="545" y="282"/>
  <text x="545" y="326" fill="#334155">Eaten</text>
</g>

<!-- transitions -->
<g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)">
  <path d="M210,70 C290,40 350,40 430,70"/>
  <path d="M430,108 C350,138 290,138 210,108"/>
  <path d="M150,136 C160,220 200,270 235,286"/>
  <path d="M480,136 C470,200 440,240 405,262"/>
  <path d="M370,250 C390,200 420,170 455,136"/>
  <path d="M405,320 C430,322 450,320 470,316"/>
  <path d="M570,250 C590,200 585,170 570,136"/>
</g>
<g font-size="12.5" fill="#0f172a" text-anchor="middle">
  <text x="320" y="38" font-weight="600">timer (7 сек)</text>
  <text x="320" y="150" font-weight="600">timer (20 сек)</text>
  <text x="128" y="226">power pellet 🟡</text>
  <text x="508" y="214">power pellet</text>
  <text x="371" y="196">цаг дуусав</text>
  <text x="436" y="308" font-size="11.5">Pac-Man идэв</text>
  <text x="612" y="200" text-anchor="end">гэртээ хүрэв</text>
</g>
<text x="20" y="384" font-size="11.5" fill="#64748b">Scatter / Chase-ийн хугацаа түвшнээс хамаарч өөр. Pac-Man (1980, Namco).</text>
</svg>
