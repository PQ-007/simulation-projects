<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="Inter,system-ui,sans-serif">
<defs>
  <marker id="r" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
</defs>
<rect width="640" height="520" fill="#fff"/>
<g font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">
  <text x="150" y="30">Client (browser)</text><text x="490" y="30">Server</text>
</g>
<line x1="150" y1="44" x2="150" y2="505" stroke="#cbd5e1" stroke-width="2"/>
<line x1="490" y1="44" x2="490" y2="505" stroke="#cbd5e1" stroke-width="2"/>

<!-- state pills -->
<g font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="central">
  <g fill="#e2e8f0"><rect x="100" y="52" width="100" height="24" rx="12"/><rect x="440" y="52" width="100" height="24" rx="12"/></g>
  <text x="150" y="64" fill="#334155">CLOSED</text><text x="490" y="64" fill="#334155">LISTEN</text>

  <g fill="#fef3c7"><rect x="94" y="120" width="112" height="24" rx="12"/><rect x="428" y="120" width="124" height="24" rx="12"/></g>
  <text x="150" y="132" fill="#92400e">SYN-SENT</text><text x="490" y="132" fill="#92400e">SYN-RECEIVED</text>

  <g fill="#dcfce7"><rect x="88" y="222" width="124" height="24" rx="12"/><rect x="428" y="222" width="124" height="24" rx="12"/></g>
  <text x="150" y="234" fill="#166534">ESTABLISHED</text><text x="490" y="234" fill="#166534">ESTABLISHED</text>

  <g fill="#fee2e2"><rect x="94" y="330" width="112" height="24" rx="12"/><rect x="434" y="330" width="112" height="24" rx="12"/></g>
  <text x="150" y="342" fill="#991b1b">FIN-WAIT-1</text><text x="490" y="342" fill="#991b1b">CLOSE-WAIT</text>

  <g fill="#fee2e2"><rect x="94" y="384" width="112" height="24" rx="12"/><rect x="440" y="420" width="100" height="24" rx="12"/></g>
  <text x="150" y="396" fill="#991b1b">FIN-WAIT-2</text><text x="490" y="432" fill="#991b1b">LAST-ACK</text>

  <g fill="#e0e7ff"><rect x="94" y="460" width="112" height="24" rx="12"/></g><text x="150" y="472" fill="#3730a3">TIME-WAIT</text>
  <g fill="#e2e8f0"><rect x="440" y="474" width="100" height="24" rx="12"/></g><text x="490" y="486" fill="#334155">CLOSED</text>
</g>

<!-- messages -->
<g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#r)">
  <line x1="206" y1="140" x2="428" y2="160"/>
  <line x1="428" y1="176" x2="206" y2="196"/>
  <line x1="206" y1="206" x2="428" y2="226"/>
  <line x1="212" y1="270" x2="428" y2="270" stroke-dasharray="6 5"/>
  <line x1="428" y1="290" x2="212" y2="290" stroke-dasharray="6 5"/>
  <line x1="206" y1="350" x2="434" y2="368"/>
  <line x1="434" y1="378" x2="206" y2="394"/>
  <line x1="440" y1="436" x2="206" y2="462"/>
  <line x1="206" y1="476" x2="440" y2="490"/>
</g>
<g font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">
  <text x="317" y="142">SYN</text>
  <text x="317" y="178">SYN + ACK</text>
  <text x="317" y="208">ACK</text>
  <text x="320" y="262" font-weight="500" fill="#475569">өгөгдөл (HTTP request)</text>
  <text x="320" y="306" font-weight="500" fill="#475569">өгөгдөл (HTTP response)</text>
  <text x="320" y="352">FIN</text>
  <text x="320" y="380">ACK</text>
  <text x="323" y="440">FIN</text>
  <text x="323" y="476">ACK</text>
</g>
<g font-size="11" fill="#64748b">
  <text x="20" y="184">3-way</text><text x="20" y="198">handshake</text>
  <text x="20" y="404">4-way</text><text x="20" y="418">close</text>
</g>
</svg>
