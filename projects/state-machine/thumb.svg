<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" font-family="Inter,system-ui,sans-serif">
<defs>
  <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20,0 V20 M0,20 H20" fill="none" stroke="#8a8f98" stroke-opacity=".16"/></pattern>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8f98"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker>
</defs>
<rect width="320" height="180" fill="url(#g)"/>

<!-- arena: the bot has spotted the player and is shooting -->
<circle cx="96" cy="104" r="62" fill="none" stroke="#8a8f98" stroke-opacity=".5" stroke-dasharray="5 5"/>
<circle cx="96" cy="104" r="40" fill="#dc2626" fill-opacity=".06" stroke="#dc2626" stroke-opacity=".45"/>
<line x1="96" y1="104" x2="150" y2="84" stroke="#dc2626" stroke-opacity=".45" stroke-dasharray="3 4"/>
<circle cx="116" cy="97" r="3" fill="#dc2626"/><circle cx="131" cy="91" r="3" fill="#dc2626" fill-opacity=".7"/>
<g transform="rotate(-20 96 104)"><rect x="100" y="100.5" width="17" height="7" rx="1.5" fill="#8a8f98"/></g>
<circle cx="96" cy="104" r="13" fill="#dc2626"/>
<rect x="80" y="80" width="32" height="4" rx="2" fill="#8a8f98" fill-opacity=".35"/><rect x="80" y="80" width="21" height="4" rx="2" fill="#16a34a"/>
<text x="96" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">Attack</text>
<rect x="143" y="76" width="15" height="15" fill="#8a8f98" transform="rotate(45 150.5 83.5)"/>

<!-- the state machine driving it -->
<g font-size="10" font-weight="600" text-anchor="middle" dominant-baseline="central">
  <path d="M224,52 Q252,34 276,52" fill="none" stroke="#8a8f98" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M286,74 Q298,98 286,122" fill="none" stroke="#3b82f6" stroke-width="2.2" marker-end="url(#b)"/>
  <path d="M272,140 Q248,156 224,140" fill="none" stroke="#8a8f98" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M206,122 Q194,98 206,74" fill="none" stroke="#8a8f98" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="250" y="34" font-size="9" fill="#8a8f98">s</text>
  <text x="304" y="98" font-size="9" fill="#3b82f6">r</text>
  <text x="248" y="160" font-size="9" fill="#8a8f98">h</text>
  <text x="188" y="98" font-size="9" fill="#8a8f98">f</text>
  <circle cx="212" cy="60" r="17" fill="none" stroke="#3b82f6" stroke-opacity=".55" stroke-width="1.5"/><text x="212" y="60" fill="#3b82f6" font-size="8.5">Patrol</text>
  <circle cx="284" cy="60" r="17" fill="none" stroke="#f59e0b" stroke-opacity=".7" stroke-width="1.5"/><text x="284" y="60" fill="#f59e0b" font-size="8.5">Chase</text>
  <circle cx="284" cy="134" r="17" fill="#dc2626" fill-opacity=".14" stroke="#dc2626" stroke-width="2.6"/><text x="284" y="134" fill="#dc2626" font-size="8.5">Attack</text>
  <circle cx="212" cy="134" r="17" fill="none" stroke="#a855f7" stroke-opacity=".7" stroke-width="1.5"/><text x="212" y="134" fill="#a855f7" font-size="8.5">Flee</text>
</g>
</svg>
